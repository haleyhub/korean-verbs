7<DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korean Verb & Adjective Conjugation Finder (한국어 활용표)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --badge-verb: #dbeafe;
      --badge-verb-text: #1e40af;
      --badge-adj: #fce7f3;
      --badge-adj-text: #9d174d;
    }
    
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1050px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 1.75rem; }
    p.subtitle { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1; min-width: 240px; padding: 12px 14px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    }
    select {
      padding: 12px; font-size: 0.95rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--card); cursor: pointer;
    }
    .count { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .table-wrap { overflow-x: auto; background: var(--card); border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 760px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { background: #f1f5f9; font-weight: 600; color: #334155; }
    tr:hover { background: #f8fafc; }
    .hangul { font-weight: 700; font-size: 1.05rem; }
    .badge { padding: 3px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .verb { background: var(--badge-verb); color: var(--badge-verb-text); }
    .adj { background: var(--badge-adj); color: var(--badge-adj-text); }
    .irreg { font-size: 0.8rem; color: var(--muted); display: block; margin-top: 2px; }

    <thead>
  <tr>
    <th>Korean</th>
    <th>English</th>
    <th>Type</th>
    <th>Polite</th>
    <th>Formal</th>
    <th>Past</th>
    <th>Future</th>
    <th>Casual</th>
  </tr>
</thead>
  </style>
  
</head>
<body>
  <div class="container">
    <header>
      <h1>Korean Verb & Adjective Conjugation
        //(한국어 활용표)
      </h1>
      <p class="subtitle">Search by Korean (먹다) or English (eat) — TOPIK 1–2 Reference</p>
    </header>
    <!--

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search Korean or English..." />
      <select id="typeFilter">
        <option value="all">All Types (Verb & Adj)</option>
        <option value="Verb">Verbs Only (동사)</option>
        <option value="Adjective">Adjectives Only (형용사)</option>
      </select>
      <select id="irregFilter">
        <option value="all">All Patterns (Regular & Irregular)</option>
        <option value="Regular">Regular Only</option>
        <option value="Irregular">Irregular Only</option>
      </select>
    </div>
    -->

    <div class="count" id="resultCount">Showing 0 entries</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Dictionary (-다)</th>
            <th>Meaning</th>
            <th>Type</th>
            <th>Polite (-아/어요)</th>
            <th>Formal (-습니다)</th>
            <th>Past (-았/었어요)</th>
            <th>Future (-(으)ㄹ 거예요)</th>
            <th>Casual (-아/어)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Load dataset first, then search logic -->
  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
